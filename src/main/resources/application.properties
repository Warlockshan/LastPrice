spring.application.name=price-service
server.port=8080

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1
spring.kafka.consumer.group-id=price-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.SP.LastPriceJava
spring.kafka.consumer.properties.spring.json.value.default.type=com.SP.LastPriceJava.kafka.PriceBatchMessage
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=1
spring.kafka.listener.missing-topics-fatal=false

logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=INFO
logging.level.com.example.priceservice=DEBUG